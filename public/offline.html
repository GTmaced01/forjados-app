<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0F0F10" />
    <title>FORJADOS offline</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at top, rgba(199,154,74,.16), transparent 38%), #0F0F10; color: #fff; }
      main { max-width: 440px; border: 1px solid rgba(255,255,255,.12); border-radius: 28px; padding: 28px; background: rgba(255,255,255,.055); box-shadow: 0 24px 80px rgba(0,0,0,.35); text-align: center; }
      img { width: 104px; height: 104px; border-radius: 24px; object-fit: cover; box-shadow: 0 16px 40px rgba(0,0,0,.4); }
      h1 { margin: 16px 0 0; color: #C79A4A; font-size: 44px; font-style: italic; letter-spacing: -2px; }
      h2 { margin: 18px 0 10px; }
      p { color: #B7B7B7; line-height: 1.6; }
      button { width: 100%; border: 0; border-radius: 16px; padding: 15px 18px; background: #C79A4A; color: #0F0F10; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="Logo FORJADOS" />
      <h1>FORJADOS</h1>
      <h2>Você está offline</h2>
      <p>O aplicativo não conseguiu carregar esta página agora. As informações já abertas antes podem aparecer quando estiverem salvas no dispositivo.</p>
      <button onclick="location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
